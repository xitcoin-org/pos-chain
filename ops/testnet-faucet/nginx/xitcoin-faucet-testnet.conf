server {
    listen 80;
    listen [::]:80;
    server_name faucet-testnet.xitcoin.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name faucet-testnet.xitcoin.org;

    ssl_certificate /etc/nginx/xitcoin-testnet-certs/main/fullchain.pem;
    ssl_certificate_key /etc/nginx/xitcoin-testnet-certs/main/privkey.pem;

    root /var/www/xitcoin-testnet-faucet;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:18089/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /claim {
        limit_except POST { deny all; }
        client_max_body_size 2k;

        proxy_pass http://127.0.0.1:18089/claim;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }

    location / {
        try_files $uri /index.html;
    }
}
