name: Versioned Go integration qualification
on:
  pull_request:
    branches: [main]
    paths: ['go.mod', 'go.sum', 'evmd/**', '**/*.go', 'docs/go-fork-provenance.json', 'scripts/verify-go-fork-provenance.py', 'scripts/qualify-versioned-go.py', '.github/workflows/versioned-go-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: Versioned graph (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        module: [root, evmd]
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 2GiB
      GOFLAGS: -p=1 -mod=readonly
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOWORK: 'off'
      QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.7'
          cache: false
      - name: Qualify the versioned graph and preserve diagnostics
        run: python3 scripts/qualify-versioned-go.py '${{ matrix.module }}'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: versioned-go-${{ matrix.module }}
          path: versioned-evidence/
