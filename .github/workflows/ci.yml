name: Xitcoin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify canonical release state
        run: python3 scripts/verify-xitcoin-release-state.py

      - name: Verify immutable GitHub Actions
        run: bash scripts/verify-actions-pinned.sh

      - name: Run Go vulnerability analysis
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          bash scripts/run-govulncheck.sh ./...

      - name: Run Go tests
        run: go test -tags=test ./...

      - name: Build xitcoind
        run: make build

      - name: Scan the release binary
        run: bash scripts/run-govulncheck.sh -mode=binary build/xitcoind

      - name: Package Linux release artifact
        shell: bash
        run: |
          set -euo pipefail
          test -x build/xitcoind
          test -f networks/xitcoin-testnet-v2-1/genesis.json
          install -m 0644 networks/xitcoin-testnet-v2-1/genesis.json build/genesis.json
          printf '%s\n' "$GITHUB_SHA" > build/COMMIT
          (
            cd build
            sha256sum xitcoind genesis.json COMMIT > MANIFEST.sha256
          )
          ./build/xitcoind version --long

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xitcoin-linux-amd64-${{ github.sha }}
          path: |
            build/xitcoind
            build/genesis.json
            build/COMMIT
            build/MANIFEST.sha256
          if-no-files-found: error
          retention-days: 30
