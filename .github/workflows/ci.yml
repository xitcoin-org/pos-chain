name: Xitcoin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify canonical release state
        run: python3 scripts/verify-xitcoin-release-state.py

      - name: Run Go vulnerability analysis
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          bash scripts/run-govulncheck.sh ./...

      - name: Run Go tests
        run: go test -tags=test ./...

      - name: Build xitcoind
        run: make build

      - name: Package Linux release artifact
        shell: bash
        run: |
          set -euo pipefail
          test -x build/xitcoind
          test -f networks/testnet/genesis.json
          install -m 0644 networks/testnet/genesis.json build/genesis.json
          printf '%s\n' "$GITHUB_SHA" > build/COMMIT
          (
            cd build
            sha256sum xitcoind genesis.json COMMIT > MANIFEST.sha256
          )
          ./build/xitcoind version --long

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v7
        with:
          name: xitcoin-linux-amd64-${{ github.sha }}
          path: |
            build/xitcoind
            build/genesis.json
            build/COMMIT
            build/MANIFEST.sha256
          if-no-files-found: error
          retention-days: 30
