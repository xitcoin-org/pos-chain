name: Temporary xcrypto module refresh
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    if: github.head_ref == 'feat/bridge-initial-route-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Refresh root module
        run: |
          go get golang.org/x/crypto@v0.56.0
          go mod tidy
      - name: Refresh evmd module
        working-directory: evmd
        run: |
          go get golang.org/x/crypto@v0.56.0
          go mod tidy
      - uses: actions/upload-artifact@v7
        with:
          name: xcrypto-module-files
          path: |
            go.mod
            go.sum
            evmd/go.mod
            evmd/go.sum
          if-no-files-found: error
