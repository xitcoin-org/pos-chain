name: Slither Analysis

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**/*.sol'
      - '.github/workflows/slither.yml'
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: Run Slither
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install contract dependencies
        run: |
          cd contracts
          npm ci
          cp -r node_modules/@openzeppelin .

      - name: Run Slither Action
        id: slither
        uses: crytic/slither-action@v0.4.2
        with:
          # Point Crytic at the Hardhat project directory. Passing the config
          # file itself makes Crytic treat JavaScript as a Solidity source.
          target: contracts
          solc-version: 0.8.20
          node-version: 24
          fail-on: medium
