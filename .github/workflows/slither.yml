name: Slither Analysis

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**/*.sol'
      - '.github/workflows/slither.yml'
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: Run Slither
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install contract dependencies
        run: |
          cd contracts
          npm ci
          cp -r node_modules/@openzeppelin .
          # Hardhat 3 prefixes build-info sources with `project/`. Slither's
          # resolver expects that virtual prefix to exist below the project.
          ln -s . project

      - name: Run Slither Action
        id: slither
        uses: crytic/slither-action@v0.4.2
        with:
          # Point Crytic at the Hardhat project directory. Passing the config
          # file itself makes Crytic treat JavaScript as a Solidity source.
          target: contracts
          solc-version: 0.8.20
          node-version: 24
          # Dependencies and deliberately adversarial test fixtures are still
          # compiled so imports resolve, but their findings are not attributed
          # to this repository. Medium/high findings in project contracts keep
          # failing the job.
          slither-args: >-
            --exclude-dependencies
            --filter-paths "(^|/)(node_modules|@openzeppelin|testdata|tests|testutil)(/|$)"
          fail-on: medium
