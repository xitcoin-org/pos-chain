name: Faucet offline recovery
on:
  pull_request:
    branches: [main]
    paths: ['ops/testnet-faucet/**', '.github/workflows/faucet-offline.yml']
  push:
    branches: [main]
    paths: ['ops/testnet-faucet/**', '.github/workflows/faucet-offline.yml']
permissions:
  contents: read
jobs:
  recovery:
    name: Faucet offline recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check runtime and run synthetic adapters
        run: |
          node --version
          node --test ops/testnet-faucet/recovery.test.js
