name: PR Conventional Commit Validation

on:
  workflow_dispatch:

jobs:
  validate-pr-title:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: PR Conventional Commit Validation
        uses:  ytanikin/pr-conventional-commits@1.5.2
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert","style","build"]'
          add_label: 'false'