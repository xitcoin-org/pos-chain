name: Generate validator incentive protobuf

on:
  pull_request:
  push:
    branches:
      - feat/daily-validator-incentives-20260827

permissions: read-all

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: make proto-gen
      - run: |
          tar -czf validator-incentives-generated.tar.gz \
            x/validatorincentives/types/tx.pb.go \
            x/validatorincentives/types/query.pb.go \
            x/validatorincentives/types/query.pb.gw.go
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validator-incentives-generated
          path: validator-incentives-generated.tar.gz
          if-no-files-found: error
