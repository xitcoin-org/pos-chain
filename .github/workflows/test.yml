name: Tests
on:
  workflow_dispatch:

permissions: read-all

jobs:
  cleanup-runs:
    runs-on: ubuntu-latest
    steps:
      - uses: rokroskar/workflow-run-cleanup-action@c631227427d0452af4994af0940d7655ebc50c7c # master
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    if: "!startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main'"

  test-unit-cover:
    runs-on: depot-ubuntu-24.04-16
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25"
          check-latest: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: technote-space/get-diff-action@f27caffdd0fb9b13f4fc191c016bb4e0632844af # v6.1.2
        with:
          PATTERNS: |
            .github/workflows/test.yml
            **/**.sol
            **/**.go
            go.mod
            go.sum
            evmd/go.mod
            evmd/go.sum
            evmd/**/**.go
            *.toml
      - name: Test and Create Coverage Report
        run: |
          make test-unit-cover
        if: env.GIT_DIFF
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          file: ./coverage.txt
          # We were getting a 500 error on codecov servers
          # so we decided to avoid blocking the CI if this fails
          fail_ci_if_error: false
        if: env.GIT_DIFF
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: technote-space/get-diff-action@f27caffdd0fb9b13f4fc191c016bb4e0632844af # v6.1.2
        with:
          PATTERNS: |
            .github/workflows/test.yml
            ./scripts/**
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
        if: env.GIT_DIFF
      - name: Install Pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
        if: env.GIT_DIFF
      - name: Test Scripts
        run: |
          make test-scripts
        if: env.GIT_DIFF
