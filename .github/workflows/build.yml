name: Build Xitcoind Release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'evmd/**'
      - 'networks/xitcoin-testnet-v2-1/**'
      - 'scripts/verify-xitcoin-release-state.py'
  push:
    branches: [main]
    tags:
      - 'v*-testnet.*'
    paths:
      - '.github/workflows/build.yml'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'evmd/**'
      - 'networks/xitcoin-testnet-v2-1/**'
      - 'scripts/verify-xitcoin-release-state.py'

concurrency:
  group: build-xitcoind-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux-amd64:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            evmd/go.sum

      - name: Verify canonical release state
        run: python3 scripts/verify-xitcoin-release-state.py

      - name: Verify Go modules
        run: |
          go mod verify
          cd evmd
          go mod verify

      - name: Build Linux AMD64 release
        run: |
          mkdir -p dist
          make BUILDDIR="$GITHUB_WORKSPACE/dist" build-linux

      - name: Verify and package release
        shell: bash
        run: |
          set -euo pipefail
          test -x dist/xitcoind
          dist/xitcoind version --long > dist/version-long.txt
          grep -F "commit: $GITHUB_SHA" dist/version-long.txt

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            grep -F "version: ${GITHUB_REF_NAME#v}" dist/version-long.txt
          fi

          cp networks/xitcoin-testnet-v2-1/genesis.json dist/genesis.json

          (
            cd dist
            sha256sum xitcoind > xitcoind.sha256
            sha256sum genesis.json > genesis.json.sha256
            sha256sum -c xitcoind.sha256
            sha256sum -c genesis.json.sha256
          )

          grep -F "$(awk '{print $1}' networks/xitcoin-testnet-v2-1/genesis.sha256)" \
            dist/genesis.json.sha256

      - name: Upload Linux AMD64 release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xitcoind-${{ github.sha }}-linux-amd64
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish-testnet-release:
    name: Publish tagged testnet release
    if: github.ref_type == 'tag'
    needs: build-linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: xitcoind-${{ github.sha }}-linux-amd64
          path: dist

      - name: Reverify downloaded artifact
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -c xitcoind.sha256
            sha256sum -c genesis.json.sha256
          )
          grep -F "commit: $GITHUB_SHA" dist/version-long.txt
          grep -F "version: ${GITHUB_REF_NAME#v}" dist/version-long.txt
          test "$(jq -r '.chain_id' dist/genesis.json)" = "xitcoin-testnet-v2-1"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Xitcoin Testnet ${GITHUB_REF_NAME#v}" \
            --notes "Pre-release binary for the active Xitcoin Public Testnet.

          Cosmos chain ID: xitcoin-testnet-v2-1
          EVM chain ID: 101089
          Source commit: $GITHUB_SHA

          This release does not activate the Cronos bridge, configure a route, submit a transaction, or authorize mainnet use. Verify both checksum files before installation." \
            dist/xitcoind \
            dist/xitcoind.sha256 \
            dist/genesis.json \
            dist/genesis.json.sha256 \
            dist/version-long.txt
