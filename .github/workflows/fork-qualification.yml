name: Fork prepublication qualification
on:
  push:
    branches: [ino/go-fork-qualification-20260913]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream:
    name: Upstream requirements (${{ matrix.repository }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        repository: [go-ethereum] # SDK continues in run 34788124256; no unchanged rerun
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 2GiB
      GOFLAGS: -p=1
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.7'
          cache: false
      - name: Run required upstream checks
        run: python3 docs/fork-qualification-20260913/qualify.py '${{ matrix.repository }}'
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fork-qualification-${{ matrix.repository }}
          path: qualification-evidence/
