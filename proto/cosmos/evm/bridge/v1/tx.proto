syntax = "proto3";
package cosmos.evm.bridge.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/xitcoin-org/pos-chain/x/bridge/types";

// Msg defines bridge settlement actions.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // SubmitAttestation validates and settles an inbound Cronos attestation.
  rpc SubmitAttestation(MsgSubmitAttestation) returns (MsgSubmitAttestationResponse);

  // InitiateOutboundTransfer burns native XTC owned by the signer.
  rpc InitiateOutboundTransfer(MsgInitiateOutboundTransfer) returns (MsgInitiateOutboundTransferResponse);
}

// MsgSubmitAttestation submits a fully signed inbound attestation.
message MsgSubmitAttestation {
  option (cosmos.msg.v1.signer) = "submitter";
  option (amino.name) = "xitcoin/bridge/MsgSubmitAttestation";

  string submitter = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string route_id = 2;
  string direction = 3;
  string source_chain_id = 4;
  string source_ref = 5;
  uint64 nonce = 6;
  string destination = 7;
  string amount = 8;
  int64 deadline_unix = 9;
  repeated bytes signatures = 10;
}

// MsgSubmitAttestationResponse returns the deterministic replay-protection ID.
message MsgSubmitAttestationResponse {
  string attestation_id = 1;
}

message MsgInitiateOutboundTransfer {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "xitcoin/bridge/MsgInitiateOutboundTransfer";

  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string route_id = 2;
  string destination = 3;
  string amount = 4;
}

message MsgInitiateOutboundTransferResponse {
  string request_id = 1;
  uint64 nonce = 2;
}
