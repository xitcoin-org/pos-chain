syntax = "proto3";
package cosmos.evm.validatoradmission.v1;

import "cosmos_proto/cosmos.proto";
import "google/api/annotations.proto";

option go_package = "github.com/xitcoin-org/pos-chain/x/validatoradmission/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/cosmos/evm/validatoradmission/v1/params";
  }

  rpc Validator(QueryValidatorRequest) returns (QueryValidatorResponse) {
    option (google.api.http).get =
      "/cosmos/evm/validatoradmission/v1/validators/{validator_address}";
  }
}

message QueryParamsRequest {}

message QueryParamsResponse {
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint32 max_approved_validators = 2;
  string minimum_self_delegation = 3;
}

message QueryValidatorRequest {
  string validator_address = 1
    [ (cosmos_proto.scalar) = "cosmos.ValidatorAddressString" ];
}

message QueryValidatorResponse {
  bool approved = 1;
}
