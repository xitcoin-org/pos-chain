syntax = "proto3";
package cosmos.evm.validatorincentives.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/xitcoin-org/pos-chain/x/validatorincentives/types";

// Msg defines the authority-controlled Validator Incentive operations.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams updates funded incentive operating parameters.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

}

// MsgUpdateParams updates all funded incentive operating parameters.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "xitcoin/validatorincentives/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint32 treasury_release_rate_basis_points = 2;
  uint64 blocks_per_year = 3;
  uint64 calculation_period_blocks = 4;
}

message MsgUpdateParamsResponse {}
